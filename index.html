<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mural de Missões da Martina 🚀</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Nunito", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(circle at 20% 10%, #3b2a8f 0%, #1a1446 55%, #0d0a2b 100%);
    color: #fff; min-height: 100vh; padding: 28px 16px 48px;
  }
  .stars { position: fixed; inset: 0; pointer-events: none;
    background-image: radial-gradient(2px 2px at 20px 30px, #fff8, transparent),
      radial-gradient(2px 2px at 120px 80px, #fff6, transparent),
      radial-gradient(1.5px 1.5px at 220px 160px, #fff9, transparent),
      radial-gradient(2px 2px at 300px 40px, #fff5, transparent);
    background-size: 340px 220px; }
  header { text-align: center; position: relative; margin-bottom: 26px; }
  .emoji { font-size: 48px; }
  h1 { font-size: clamp(28px, 7vw, 44px); font-weight: 900; letter-spacing: 1px;
    text-shadow: 0 4px 0 #f59e0b55; margin: 6px 0; }
  .sub { font-size: 18px; opacity: .9; }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; position: relative; }
  a.card { display: flex; align-items: center; gap: 16px; text-decoration: none; color: #1f1b3a;
    background: #fff; border-radius: 22px; padding: 18px; min-height: 92px;
    box-shadow: 0 6px 0 rgba(0,0,0,.25); transition: transform .12s; border-left: 10px solid var(--c); }
  a.card:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .icon { font-size: 44px; flex-shrink: 0; }
  .info h2 { font-size: 21px; font-weight: 900; }
  .info p { font-size: 15px; color: #5b5675; margin-top: 2px; }
  .tag { display: inline-block; font-size: 12px; font-weight: 800; color: #fff; background: var(--c);
    border-radius: 99px; padding: 3px 10px; margin-top: 6px; }
  footer { text-align: center; margin-top: 30px; opacity: .7; font-size: 14px; position: relative; }
</style>
</head>
<body>
<div class="stars"></div>
<header>
  <div class="emoji">🚀⭐📚</div>
  <h1>MURAL DE MISSÕES</h1>
  <p class="sub">Escolha uma missão, Martina! Aprender é uma aventura! 🔎</p>
</header>
<main id="lista"></main>
<footer>Novas missões aparecem aqui automaticamente ✨</footer>
<script>
  // Lista de missões — a mais recente primeiro.
  // Para adicionar: { titulo, materia, tema, icone, cor, link }
  const missoes = [
    { titulo: "Missão Solo e Ar", materia: "Ciências", tema: "O solo, os aquíferos e o ar", icone: "🌱", cor: "#8d5524",
      link: "/missao-solo-e-ar/" },
    { titulo: "Missão Boa Convivência", materia: "Filosofia", tema: "Limites, certo e errado e o Equinócio", icone: "🤝", cor: "#c4265e",
      link: "/boa-convivencia/" },
    { titulo: "Missão Planeta Limpo", materia: "Geografia", tema: "Consumo, lixo e reciclagem", icone: "♻️", cor: "#2a9d8f",
      link: "/planeta-limpo/" },
    { titulo: "Missão Terra", materia: "Ciências", tema: "A Terra e os Astros", icone: "🌎", cor: "#2563eb",
      link: "https://missao-terra-martina.vercel.app/" }
  ];
  const lista = document.getElementById("lista");
  missoes.forEach(m => {
    const a = document.createElement("a");
    a.className = "card"; a.href = m.link; a.style.setProperty("--c", m.cor);
    a.innerHTML = `<span class="icon">${m.icone}</span>
      <span class="info"><h2>${m.titulo}</h2><p>${m.tema}</p><span class="tag">${m.materia} • 3º ano</span></span>`;
    lista.appendChild(a);
  });
</script>
</body>
</html>
